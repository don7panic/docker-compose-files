services:
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_HOST: 0.0.0.0
      MB_JETTY_PORT: 3000
      TZ: Asia/Shanghai
    volumes:
      - ~/docker-volumes/metabase-data:/metabase-data # Metabase 配置、问题和看板
    networks:
      - clickhouse_local-services # 访问已运行的 ClickHouse 容器
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q '\"ok\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

networks:
  clickhouse_local-services:
    external: true
