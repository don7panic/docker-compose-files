services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3 # LTS 版本（每年 3 月 / 8 月发布的是 LTS）
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP 接口（网页、API 用）
      - "9000:9000" # 原生 TCP 接口（clickhouse-client 用）
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-mydb}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ~/docker-volumes/clickhouse-data:/var/lib/clickhouse # 数据目录
      - ./config.d:/etc/clickhouse-server/config.d:ro # 性能配置:关闭系统日志表(本地开发用)
    cpus: 2 # 限制最多 2 核,防止日志表合并/数据合并吃满所有核
    mem_limit: 4g # 限制内存,防止合并失败重试循环
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - local-services
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  local-services:
    driver: bridge