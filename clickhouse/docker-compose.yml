version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3 # LTS 版本（每年 3 月 / 8 月发布的是 LTS）
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP 接口（网页、API 用）
      - "9000:9000" # 原生 TCP 接口（clickhouse-client 用）
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-mydb}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ~/docker-volumes/clickhouse-data:/var/lib/clickhouse # 数据目录
      - ~/docker-volumes/clickhouse-logs:/var/log/clickhouse-server # 日志目录
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - local-services
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  local-services:
    driver: bridge